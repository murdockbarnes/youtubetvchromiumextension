<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header svg { flex-shrink: 0; }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #252525;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .status-label {
      font-size: 13px;
      color: #aaa;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
      margin-right: 6px;
      display: inline-block;
    }
    .status-dot.off { background: #666; }
    .status-text {
      font-size: 13px;
      font-weight: 500;
    }
    .toggle-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 8px;
    }
    .toggle-btn.on {
      background: #cc0000;
      color: #fff;
    }
    .toggle-btn.on:hover { background: #aa0000; }
    .toggle-btn.off {
      background: #4caf50;
      color: #fff;
    }
    .toggle-btn.off:hover { background: #388e3c; }
    .open-btn {
      width: 100%;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 8px;
      background: transparent;
      color: #e8e8e8;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .open-btn:hover { background: #333; }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" width="28" height="28" style="object-fit: contain; border-radius: 6px;">
    <h1>YouTube TV Mode</h1>
  </div>

  <div class="status">
    <span class="status-label">Status</span>
    <span>
      <span class="status-dot" id="dot"></span>
      <span class="status-text" id="statusText">Active</span>
    </span>
  </div>

  <button class="toggle-btn on" id="toggleBtn">Disable</button>
  <button class="open-btn" id="openBtn">Open YouTube TV</button>

  <div class="footer">v1.0.0 &bull; By Scott Allan</div>

  <script src="popup.js"></script>
</body>
</html>
